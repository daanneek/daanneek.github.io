name: Deploy European National Parks

on:
  push:
    branches: [master]
    paths:
      - "EuropeanNationalParks/**"
      - ".github/workflows/deploy-european-national-parks.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EuropeanNationalParks/package-lock.json

      - name: Install dependencies
        working-directory: EuropeanNationalParks
        run: npm ci

      - name: Build site
        working-directory: EuropeanNationalParks
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/EuropeanNationalParks
          cp -R EuropeanNationalParks/dist/. _site/EuropeanNationalParks/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
