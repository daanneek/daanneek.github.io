<head>
  <meta charset="utf-8" />
  <title>SurveyJS on GitHub Pages</title>
  <link
    href="https://unpkg.com/survey-core/survey-core.min.css"
    rel="stylesheet"
  />
  <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
</head>
<body>
  <div id="surveyContainer"></div>
  <script>
    const surveyJson = { elements: [ { name: "name", type: "text", title: "Your name:" }, { name: "satisfaction", type: "radiogroup", title: "Satisfaction:", choices: ["Good","OK","Bad"] } ] }; const survey = new Survey.Model(surveyJson); survey.onComplete.add(function(sender) { const results = sender.data; alert("Thanks — results: " + JSON.stringify(results)); // To store responses, POST `results` to your server: // fetch("https://your-server.example/submit", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(results)}); }); document.addEventListener("DOMContentLoaded", () => survey.render(document.getElementById("surveyContainer")));
  </script>
</body>
